[project]
name = "bert-sentiment"
version = "1.0.0"
description = "基于 BERT 的中文情感分析微调对比研究（全量微调 vs LoRA）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.30",
    "peft>=0.10",
    "datasets",
    "scikit-learn",
    "pyyaml",
    "accelerate",
]

[tool.uv]
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
